name: Refresh data and deploy

# Runs on every push to main (e.g. after merging a discovery PR), weekly to
# pick up config.json edits on Hugging Face, and on demand.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch configs and build data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/build.py --refresh
      - name: Commit data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || { git commit -m "data: refresh from Hugging Face"; git push; }
      # Browsers may reuse Pages files for 10 minutes, so a new index.html could otherwise run a cached old
      # app.js. A per-deploy query string makes each page load the script, styles and data from its own deploy.
      - name: Stamp asset URLs with this deploy
        run: |
          sed -i -e "s|href=\"style.css\"|href=\"style.css?v=${GITHUB_RUN_ID}\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=${GITHUB_RUN_ID}\"|" site/index.html
          grep -q "app.js?v=${GITHUB_RUN_ID}" site/index.html && grep -q "style.css?v=${GITHUB_RUN_ID}" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
