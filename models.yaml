# MoE Config Atlas: curated model list.
# Each entry is one MoE architecture. Versions that share it (they changed only post-training,
# context length, RoPE scaling, MTP layers or the weight format) go in one entry named after the
# latest of them; a version whose architecture differs in any way (attention, MoE, layer count or
# widths, modality, vocabulary) gets an entry of its own. scripts/build.py checks every version's
# config.json against the entry's.
#
#   name          name of the latest mainline version, shown on the site
#   repo          HF repo of that version, whose config.json is parsed
#   variants      earlier mainline versions with the same architecture
#   derived       same-architecture models made from it for one use (code, math, a domain, a
#                 draft head) and copies in another precision or format; never the entry's name
#   released      YYYY-MM of the first HF upload of this architecture
#   total, active parameters in billions, from the model card / tech report
#   override      fields the parser cannot read from config.json (see scripts/hfconfig.py)
#   notes         short free-text footnote shown on the site
#
# Only models first released 2025-01 or later are tracked.

