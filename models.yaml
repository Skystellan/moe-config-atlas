# post-training / attention / quantization but kept the same MoE config go
# under `variants`.
#
#   repo          HF repo whose config.json is parsed (the canonical one)
#   released      YYYY-MM of the first HF upload of this configuration
#   total, active parameters in billions, from the model card / tech report
#   override      fields the parser cannot read from config.json (see scripts/hfconfig.py)
#   notes         short free-text footnote shown on the site
#
# Only models first released 2025-01 or later are tracked.

