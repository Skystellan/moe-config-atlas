# MoE Config Atlas: frontier techniques.
# Each entry is one architecture or training change from 2024 onward (plus a few
# older ones that are still spreading). The site shows where it came from, what
# independent ablations measured, and which tracked open MoE configs use it.
#
#   name      display name
#   cat       attn | pos | mixer | resid | moe | io | optim
#   date      YYYY-MM of the first public description
#   source    [title, url] of the paper / report / code that introduced it
#   evidence  measured effects from independent studies: list of {by, text, url}
#   feature   structural feature key in models.json; adopters are computed from it
#   match     only count models whose feature value is in this list (optional)
#   models    adopters listed by hand when config.json can't show it, with `cite`
#   note      one-line remark (optional)
#
# Evidence keys used below:
#   Pavlichenko 2026: "I Tried Every LLM Architecture Change since 2020", 1,129 runs at
#     d=512-1280; numbers are bits-per-byte changes, negative is better.
#   Marin: Open Athena's pretraining-efficiency post and the 535B-A23B hero-run spec.

- name: 输出门（Gated Attention）
  cat: attn
  date: 2025-05
  source: [Gated Attention for Large Language Models, https://arxiv.org/abs/2505.06708]
  feature: attn_gate
  evidence:
  - {by: Pavlichenko 2026, text: "−2.1% / −1.4% / −1.5%（d=512/768/1024）；和 QK-norm 一起 −3.6% / −2.6%，等服务成本预测 −2.0%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "535B 用每头一个标量的门 2·sigmoid(x·w)", url: "https://github.com/marin-community/marin/issues/8435"}

- name: QK-norm
  cat: attn
  date: 2023-02
  source: [Scaling Vision Transformers to 22 Billion Parameters, https://arxiv.org/abs/2302.05442]
  feature: qk_norm
  evidence:
  - {by: Pavlichenko 2026, text: "各宽度约 −1%；去掉 RMSNorm 的可学习缩放后收益消失", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: MLA
  cat: attn
  date: 2024-05
  source: [DeepSeek-V2, https://arxiv.org/abs/2405.04434]
  feature: mla
  evidence:
  - {by: Pavlichenko 2026, text: "同参数下和 MHA 持平；KV 缩小后可服务更大的模型，等服务成本预测 −4.1%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: K=V 共享
  cat: attn
  date: 2026-03
  source: [Gemma 4 / DeepSeek-V4 的全局层, https://huggingface.co/google/gemma-4-26B-A4B-it]
  feature: k_eq_v
  evidence:
  - {by: Pavlichenko 2026, text: "+1.2%（更差），而且 vLLM 仍分别缓存 K 和 V", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: 可学习 attention sink
  cat: attn
  date: 2025-08
  source: [gpt-oss-120b & gpt-oss-20b Model Card, https://arxiv.org/abs/2508.10925]
  feature: attn_sink
  evidence:
  - {by: Pavlichenko 2026, text: "没有可测差异", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: XSA（Exclusive Self Attention）
  cat: attn
  date: 2026-03
  source: [Exclusive Self Attention, https://arxiv.org/abs/2603.09078]
  evidence:
  - {by: Pavlichenko 2026, text: "可学习版本的收益到 d=768 消失", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "已采用，称带来又一次加速；535B 的注意力输出减去自身 V 方向的分量", url: "https://openathena.ai/blog/pretraining-speedup/"}

- name: VHA（Virtual Head Attention）
  cat: attn
  date: 2026-10
  source: ["Virtual Head Attention", https://arxiv.org/abs/2610.17959]
  models:
  - {name: ERNIE-5.5-Flash, cite: "https://huggingface.co/baidu/ERNIE-5.5-Flash-Base-BF16"}
  note: 先把少量物理 query 头线性混成更多"虚拟头"，输出再做一次低秩的跨头混合；两步都是线性的，推理时并进 Q 和输出投影，跑起来仍是普通 GQA

- name: 差分注意力
  cat: attn
  date: 2024-10
  source: [Differential Transformer, https://arxiv.org/abs/2410.05258]
  evidence:
  - {by: Pavlichenko 2026, text: "收益到 d=768 消失", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: QKV 短卷积
  cat: attn
  date: 2021-09
  source: [Primer, https://arxiv.org/abs/2109.08668]
  feature: attn_conv
  note: softmax 注意力的 Q/K/V 先过因果深度卷积（线性注意力层里自带的不算）；Inkling 还在两个子层的输出上各加一个
  evidence:
  - {by: Pavlichenko 2026, text: "对 K、V 做 4 抽头因果卷积：−1.0% / −0.7% / −0.7%，最终架构保留在全局层", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "535B 在 K、注意力输出、MoE 输出三处加 4 抽头短卷积", url: "https://github.com/marin-community/marin/issues/8435"}

- name: CCA（压缩卷积注意力）
  cat: attn
  date: 2025-10
  source: ["Compressed Convolutional Attention", https://arxiv.org/abs/2510.04476]
  feature: attn_conv
  match: [Q、K（CCA）]
  note: 在压缩的潜空间里算注意力，并对 Q、K 做卷积混合；ZAYA1 用的是分组版 CCGQA

- name: Canon 层
  cat: attn
  date: 2025-12
  source: ["Physics of Language Models: Part 4.1", https://arxiv.org/abs/2512.17351]
  evidence:
  - {by: Pavlichenko 2026, text: "在已有卷积的候选模型上没有帮助（Canon-A +0.78%，Canon-C +0.07%）", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: Value residual
  cat: attn
  date: 2024-10
  source: [Value Residual Learning, https://arxiv.org/abs/2410.17897]
  evidence:
  - {by: Pavlichenko 2026, text: "−2.1% / −0.8% / −1.0%；混合模型的全局层上 −0.4%，最终架构保留", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: 全局层 NoPE
  cat: pos
  date: 2025-01
  source: [Rope to Nope and Back Again, https://arxiv.org/abs/2501.18795]
  feature: nope
  note: 全局层不加位置编码，位置信息交给滑窗、分块或线性层（Llama 4 叫 iRoPE）
  evidence:
  - {by: Pavlichenko 2026, text: "混合模型的全局层去掉位置编码没问题，加回部分 RoPE 反而 +0.2%；所有层都去掉则训练崩坏", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: SSMax（按长度放大 query）
  cat: pos
  date: 2025-01
  source: [Scalable-Softmax Is Superior for Attention, https://arxiv.org/abs/2501.19399]
  feature: len_scale
  note: 按位置的 log 放大 query，长上下文里注意力不被摊平。Llama 4、Beam、Inkling 只用在不加 RoPE 的全局层，Mistral Large 4 每层都用、系数按头学习；Step-5 把它用在稀疏索引器的打分上

- name: 部分 RoPE
  cat: pos
  date: 2021-06
  source: [GPT-J 的 rotary_dim, https://github.com/kingoflolz/mesh-transformer-jax]
  feature: partial_rope
  evidence:
  - {by: Pavlichenko 2026, text: "和完整 RoPE 相差 1% 以内，BPB 分不出差别", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "PKO 的 1.2× 加速里约一半来自部分 RoPE", url: "https://openathena.ai/blog/pretraining-speedup/"}

- name: PKO（partial key offset）
  cat: pos
  date: 2026-04
  source: [Marin issue 4976, https://github.com/marin-community/marin/issues/4976]
  evidence:
  - {by: Marin, text: "理论加速 1.19–1.24×，实测 1.2×，已采用", url: "https://openathena.ai/blog/pretraining-speedup/"}

- name: Lightning Attention
  cat: mixer
  date: 2025-01
  source: [MiniMax-01, https://arxiv.org/abs/2501.08313]
  feature: linear_attn
  match: [Lightning]

- name: Mamba-2
  cat: mixer
  date: 2024-05
  source: [Transformers are SSMs, https://arxiv.org/abs/2405.21060]
  feature: linear_attn
  match: [Mamba-2]
  evidence:
  - {by: Pavlichenko 2026, text: "3:1 混合，等服务成本预测 −3.6%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: Gated DeltaNet
  cat: mixer
  date: 2024-12
  source: [Gated Delta Networks, https://arxiv.org/abs/2412.06464]
  feature: linear_attn
  match: [GDN]
  evidence:
  - {by: Pavlichenko 2026, text: "3:1 混合，等服务成本预测 −4.2%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: KDA
  cat: mixer
  date: 2025-10
  source: [Kimi Linear, https://arxiv.org/abs/2510.26692]
  feature: linear_attn
  match: [KDA]
  evidence:
  - {by: Pavlichenko 2026, text: "3:1 混合 −3.7% / −3.4% / −3.4%，可服务 3.6 倍参数，等服务成本预测 −4.7%；加上 MoE、QK-norm、输出门之后领先只剩 0.3%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: DSA
  cat: mixer
  date: 2025-09
  source: [DeepSeek-V3.2-Exp, https://github.com/deepseek-ai/DeepSeek-V3.2-Exp]
  feature: sparse_attn
  match: [DSA]
  evidence:
  - {by: Pavlichenko 2026, text: "质量无可测损失；16–24K 上下文时索引器比省下的注意力还贵，长上下文才划算", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: 压缩稀疏注意力（CSA / HCA）
  cat: mixer
  date: 2026-04
  source: [DeepSeek-V4, https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro]
  feature: sparse_attn
  match: [CSA+HCA, CSA, HCA, DSA+HCA, 压缩]
  evidence:
  - {by: Pavlichenko 2026, text: "CSA 在 2021 参考模型上 +8.3%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: QSA
  cat: mixer
  date: 2026-08
  source: [Qwen3.8-Flash-Next, https://huggingface.co/Qwen/Qwen3.8-Flash-Next]
  feature: sparse_attn
  match: [QSA]
  evidence:
  - {by: Pavlichenko 2026, text: "质量无可测损失；256K 时可服务的模型大 1.05 倍", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: LSA（LongCat Sparse Attention）
  cat: mixer
  date: 2026-08
  source: ["LongCat Sparse Attention: Taming the Lightning via Streaming-aware Hierarchical Cross-Layer Indexing", https://arxiv.org/abs/2608.01662]
  feature: sparse_attn
  match: [LSA]
  note: DSA 的三处改动：top-k 预算里固定留开头 16 个和最近 1024 个 token，读 KV 时更连续；相邻层复用一次索引；推理时先按块粗选再逐 token 细选。LongCat-Flash-Lite-Sparse 也用它，归在 LongCat-Flash-Lite 一行

- name: LSA（Latent Sparse Attention）
  cat: mixer
  date: 2026-10
  source: ["Latent Sparse Attention: Towards Subquadratic Ultra-Long Context Attention", https://arxiv.org/abs/2610.42147]
  note: key 在学到的潜空间里分层聚类，query 每一层只给少数几个簇打分，参与注意力的 key 数和上下文长度无关。D-LSA 冻结原模型、只蒸馏新加的索引器（作者在 GLM-5.3-Flash 和 Qwen-3.8-27B 上做了，权重没有放出），N-LSA 从头训练；代码和 SGLang 实现已开源

- name: 索引跨层复用（IndexShare / IndexCache）
  cat: mixer
  date: 2026-03
  source: [IndexCache, https://arxiv.org/abs/2603.12201]
  feature: index_share
  evidence:
  - {by: Pavlichenko 2026, text: "每 2–4 层跑一次索引器，128K 时服务量 1.33–1.37 倍；4 层共用时一个种子崩了，加 IndexCache 的跨层蒸馏损失后正常", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: SGLang 团队, text: "DeepSeek-V4.1 有 8 个索引源层，其余压缩层直接复用最近一次的 top-512 选择", url: "https://www.lmsys.org/blog/2026-09-10-deepseek-v41"}

- name: 跨层 KV 共享
  cat: mixer
  date: 2024-05
  source: [You Only Cache Once (YOCO), https://arxiv.org/abs/2405.05254]
  feature: kv_share
  evidence:
  - {by: SGLang 团队, text: "DeepSeek-V4.1 只有 4 个源层生成压缩 KV 和索引键，其余层读最近的源层，滑窗 KV 仍是各层自己的", url: "https://www.lmsys.org/blog/2026-09-10-deepseek-v41"}

- name: 超连接（HC）
  cat: resid
  date: 2024-09
  source: [Hyper-Connections, https://arxiv.org/abs/2409.19606]
  feature: hyper_conn
  match: [HC×4, iHC×4]
  evidence:
  - {by: Pavlichenko 2026, text: "参考模型 −2.4% / −2.2% / −1.3% 但服务成本抵消收益；在 2026 混合模型上是第一轮最大的增益（−1.8%）", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: mHC
  cat: resid
  date: 2025-12
  source: ["mHC: Manifold-Constrained Hyper-Connections", https://arxiv.org/abs/2512.24880]
  feature: hyper_conn
  match: [mHC×4]
  evidence:
  - {by: Pavlichenko 2026, text: "质量和 HC 相同、高学习率更稳，但可服务的激活参数从 9.1B 降到 7.4B", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: AttnRes
  cat: resid
  date: 2026-03
  source: [Attention Residuals, https://arxiv.org/abs/2603.15031]
  feature: attn_res
  evidence:
  - {by: Pavlichenko 2026, text: "−1.6% / −1.2% / −1.2%，等服务成本预测 −0.7%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "块 AttnRes（块大小 4）实测 1.06–1.12×，吞吐降 4–7%", url: "https://openathena.ai/blog/pretraining-speedup/"}

- name: 残差门
  cat: resid
  date: 2026-09
  source: [Muse Spark 的 MuseSparkResidualGate（transformers）, https://github.com/huggingface/transformers/blob/main/src/transformers/models/muse_spark/modeling_muse_spark.py]
  feature: res_gate

- name: FarSkip-Collective
  cat: resid
  date: 2025-11
  source: ["FarSkip-Collective: Unhobbling Blocking Communication in Mixture of Experts Models", https://arxiv.org/abs/2511.11505]
  models:
  - {name: Instella-MoE-16B-A3B, cite: "https://arxiv.org/abs/2609.00791"}
  note: 下一层注意力读的是还没加路由专家输出的残差，MoE 的 all-to-all 合并可以和它同时跑；已有模型可以靠自蒸馏改成这种连接

- name: GatedNorm
  cat: resid
  date: 2026-01
  source: [A Unified View of Attention and Residual Sinks, https://arxiv.org/abs/2601.22966]
  feature: gated_norm
  evidence:
  - {by: Pavlichenko 2026, text: "第二轮里唯一保住收益的改动（d=512 −0.71%，d=768 −0.49%），还消除了梯度尖峰", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "535B 在每个 RMSNorm 后都加，秩 128", url: "https://github.com/marin-community/marin/issues/8435"}

- name: 三明治 / 后置归一化
  cat: resid
  date: 2024-07
  source: [Gemma 2, https://arxiv.org/abs/2408.00118]
  feature: post_norm
  evidence:
  - {by: Pavlichenko 2026, text: "没有质量收益，学习率 8e-3 时会炸", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: logit 软截断
  cat: io
  date: 2024-07
  source: [Gemma 2, https://arxiv.org/abs/2408.00118]
  feature: softcap
  evidence:
  - {by: Pavlichenko 2026, text: "没有质量收益，也替代不了 QK-norm 的可学习缩放", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: DyT
  cat: resid
  date: 2025-03
  source: [Transformers without Normalization, https://arxiv.org/abs/2503.10622]
  evidence:
  - {by: Pavlichenko 2026, text: "常规初始化下 3 个种子 2 个发散；嵌入乘 √d 后仍 +3.1%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: LatentMoE
  cat: moe
  date: 2025-12
  source: [NVIDIA Nemotron 3, https://arxiv.org/abs/2512.20856]
  feature: latent
  evidence:
  - {by: Pavlichenko 2026, text: "对 dense 参考模型是最好的单项（等服务成本 −5.7%），但加到已有细粒度 MoE 的模型上在噪声内", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}
  - {by: Marin, text: "535B 把 token 压到 3072 维再分发给 384 个专家", url: "https://github.com/marin-community/marin/issues/8435"}

- name: 无辅助损失的专家偏置
  cat: moe
  date: 2024-08
  source: [Auxiliary-Loss-Free Load Balancing, https://arxiv.org/abs/2408.15664]
  feature: expert_bias
  evidence:
  - {by: Pavlichenko 2026, text: "改用 softmax + 均衡损失、去掉共享专家、换 SMEBU 或 sqrt-softplus 都没有可测差异", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: 分位数均衡
  cat: moe
  date: 2026-04
  source: [Mixture of Experts Quantile Balancing, https://openathena.ai/blog/quantile-balancing/]
  feature: expert_bias
  match: [分位数]
  evidence:
  - {by: Marin, text: "在 32B-A5B（1e22 FLOPs）上验证，535B 采用", url: "https://openathena.ai/blog/quantile-balancing/"}

- name: sqrt-softplus 路由
  cat: moe
  date: 2026-04
  source: [DeepSeek-V4, https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro]
  feature: router
  match: [sqrtsoftplus]

- name: 零计算专家
  cat: moe
  date: 2024-10
  source: [MoE++, https://arxiv.org/abs/2410.07348]
  feature: zero_expert
  evidence:
  - {by: Pavlichenko 2026, text: "null experts +0.2%（更差）", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: Multi-Router（多视角 Latent MoE）
  cat: moe
  date: 2026-10
  source: ["Multi-View Latent MoE: Letting Every Router Shape Expert Computation", https://arxiv.org/abs/2610.40577]
  models:
  - {name: ERNIE-5.5-Flash, cite: "https://huggingface.co/baidu/ERNIE-5.5-Flash-Base-BF16"}
