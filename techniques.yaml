- name: 哈希路由层
  cat: moe
  date: 2021-06
  source: [Hash Layers For Large Sparse Models, https://arxiv.org/abs/2106.04426]
  feature: hash_route

- name: 共享专家门
  cat: moe
  date: 2024-07
  source: [Qwen2 Technical Report, https://arxiv.org/abs/2407.10671]
  feature: shared_gate

- name: SwiGLU 限幅
  cat: moe
  date: 2025-08
  source: [gpt-oss-120b & gpt-oss-20b Model Card, https://arxiv.org/abs/2508.10925]
  feature: act_clamp

- name: ReLU² 专家
  cat: moe
  date: 2021-09
  source: [Primer, https://arxiv.org/abs/2109.08668]
  feature: ffn_act
  match: [ReLU²]
  evidence:
  - {by: Pavlichenko 2026, text: "dense MLP 里最好（等服务成本 −1.5%），放进 2026 混合模型的专家里 +0.7%", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: dense FFN 放到最后一层
  cat: moe
  date: 2026-10
  source: ["I Tried Every LLM Architecture Change since 2020", https://x.com/nv_pavlichenko/status/2116154049217089946]
  note: 收录的模型都把 dense 层放在最前面
  evidence:
  - {by: Pavlichenko 2026, text: "−0.42% / −0.41% / −0.33%，8 个种子全部改善，并消除第一层 dense FFN 引起的梯度尖峰", url: "https://x.com/nv_pavlichenko/status/2116154049217089946"}

- name: MTP
  cat: io
